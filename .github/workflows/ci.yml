name: CI

on:
  push:
  pull_request:
    branches: [main]

env:
  VULKAN_SDK_VERSION: '1.3.296.0'

jobs:
  build:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        config: [Debug, Release, Sanitizer]
    defaults:
      run:
        shell: pwsh -NoProfile {0}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Setup Vulkan SDK
        uses: humbletim/setup-vulkan-sdk@v1.2.1
        with:
          vulkan-query-version: ${{ env.VULKAN_SDK_VERSION }}
          vulkan-components: Vulkan-Headers, Vulkan-Loader
          vulkan-use-cache: true

      - name: Build lib dependencies
        run: ./utils/build_lib_dependencies.ps1 -Config ${{ matrix.config }}

      - name: Build sample dependencies
        run: ./utils/build_sample_dependencies.ps1 -Config ${{ matrix.config }}

      - name: Generate VS solution
        run: ./utils/generate_project.ps1

      - name: Build solution
        run: msbuild PHOENIX.sln /p:Configuration=${{ matrix.config }} /m
